server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: media-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:media;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-cloud-1234567890}

media:
  storage:
    local-root: ${MEDIA_LOCAL_ROOT:./.data/media}
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:/media}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
