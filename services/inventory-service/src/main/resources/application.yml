server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:inventory;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-cloud-1234567890}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
