server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:orders;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-cloud-1234567890}

internal:
  api-key: ${INTERNAL_API_KEY:local-internal-api-key-change-me}

order:
  payment-ttl-seconds: ${ORDER_PAYMENT_TTL_SECONDS:900}

clients:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  cart:
    base-url: ${CART_SERVICE_URL:http://localhost:8087}

jobs:
  order-expiration:
    delay-ms: ${ORDER_RECONCILIATION_DELAY_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
