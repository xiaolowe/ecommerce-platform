server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:payment;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-cloud-1234567890}

clients:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8084}

internal:
  api-key: ${INTERNAL_API_KEY:local-internal-api-key-change-me}

payment:
  ttl-minutes: ${PAYMENT_TTL_MINUTES:15}

jobs:
  payment-reconciliation:
    delay-ms: ${PAYMENT_RECONCILIATION_DELAY_MS:30000}
  payment-expiration:
    delay-ms: ${PAYMENT_EXPIRATION_DELAY_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
