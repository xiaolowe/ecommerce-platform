server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:auth;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-cloud-1234567890}
    issuer: ${JWT_ISSUER:ecommerce-auth}
    ttl: ${JWT_TTL:PT1H}

bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_NAME:Platform Admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
