apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  AUTH_SERVICE_URL: http://auth-service:8081
  CATALOG_SERVICE_URL: http://catalog-service:8082
  INVENTORY_SERVICE_URL: http://inventory-service:8083
  ORDER_SERVICE_URL: http://order-service:8084
  MEDIA_SERVICE_URL: http://media-service:8085
  PAYMENT_SERVICE_URL: http://payment-service:8086
  CART_SERVICE_URL: http://cart-service:8087
  AUTH_DB_URL: jdbc:mysql://mysql.example.internal:3306/ecommerce_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  CATALOG_DB_URL: jdbc:mysql://mysql.example.internal:3306/ecommerce_catalog?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  INVENTORY_DB_URL: jdbc:mysql://mysql.example.internal:3306/ecommerce_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  ORDER_DB_URL: jdbc:mysql://mysql.example.internal:3306/ecommerce_order?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  MEDIA_DB_URL: jdbc:mysql://mysql.example.internal:3306/ecommerce_media?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  PAYMENT_DB_URL: jdbc:mysql://mysql.example.internal:3306/ecommerce_payment?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  CART_DB_URL: jdbc:mysql://mysql.example.internal:3306/ecommerce_cart?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  ORDER_PAYMENT_TTL_SECONDS: "900"
  JWT_ISSUER: ecommerce-auth
  JWT_TTL: PT1H
  CORS_ALLOWED_ORIGINS: https://shop.example.com,https://admin.shop.example.com
